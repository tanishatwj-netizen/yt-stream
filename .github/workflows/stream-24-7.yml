name: Cloud 24/7 YouTube Live Streamer (No PC Needed)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct Cloudflare R2 Video URL (e.g. https://stream.techwithjoshi.in/video/...)'
        required: true
      rtmp_server:
        description: 'YouTube RTMP Ingest Server'
        required: true
        default: 'rtmp://a.rtmp.youtube.com/live2'
      stream_key:
        description: 'YouTube Stream Key'
        required: true
      overlay_text:
        description: 'Text overlay burnt onto video (OBS-style)'
        required: false
        default: ''
      overlay_x_pct:
        description: 'Text X Position Percentage (0-100)'
        required: false
        default: '50'
      overlay_y_pct:
        description: 'Text Y Position Percentage (0-100)'
        required: false
        default: '12'
      overlay_color:
        description: 'Text color (yellow, white, cyan, green, red)'
        required: false
        default: 'yellow'
      overlay_fontsize:
        description: 'Font size in px'
        required: false
        default: '48'
      overlay_transform:
        description: 'Text Transformation (none, uppercase, lowercase)'
        required: false
        default: 'none'
      overlay_box:
        description: 'Draw semi-transparent background box'
        required: false
        default: 'true'

  repository_dispatch:
    types: [start_stream]

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Verify FFmpeg & TrueType Fonts
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          sudo apt-get install -y fonts-dejavu-core fonts-freefont-ttf || true

      - name: Stream Video with OBS Text Overlay to YouTube Live 24/7
        run: |
          VIDEO_URL="${{ github.event.inputs.video_url || github.event.client_payload.video_url }}"
          RTMP_SERVER="${{ github.event.inputs.rtmp_server || github.event.client_payload.rtmp_server || 'rtmp://a.rtmp.youtube.com/live2' }}"
          STREAM_KEY="${{ github.event.inputs.stream_key || github.event.client_payload.stream_key }}"

          OVERLAY_TEXT="${{ github.event.inputs.overlay_text || github.event.client_payload.overlay_text }}"
          OVERLAY_X="${{ github.event.inputs.overlay_x_pct || github.event.client_payload.overlay_x_pct || '50' }}"
          OVERLAY_Y="${{ github.event.inputs.overlay_y_pct || github.event.client_payload.overlay_y_pct || '12' }}"
          OVERLAY_COLOR="${{ github.event.inputs.overlay_color || github.event.client_payload.overlay_color || 'yellow' }}"
          OVERLAY_SIZE="${{ github.event.inputs.overlay_fontsize || github.event.client_payload.overlay_fontsize || '48' }}"
          OVERLAY_TRANSFORM="${{ github.event.inputs.overlay_transform || github.event.client_payload.overlay_transform || 'none' }}"
          OVERLAY_BOX="${{ github.event.inputs.overlay_box || github.event.client_payload.overlay_box || 'true' }}"

          if [ -z "$VIDEO_URL" ] || [ -z "$STREAM_KEY" ]; then
            echo "Error: Video URL or Stream Key is missing."
            exit 1
          fi

          RTMP_DEST="${RTMP_SERVER%/}/${STREAM_KEY}"
          echo "=========================================="
          echo "Starting 24/7 Cloud RTMP Stream"
          echo "Video Source: $VIDEO_URL"
          echo "RTMP Ingest:  $RTMP_SERVER"
          echo "=========================================="

          # Configure OBS-style text overlay filter if text is provided
          VIDEO_ENCODE_ARGS="-c:v copy"
          if [ -n "$OVERLAY_TEXT" ]; then
            FONT_PATH="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
            if [ ! -f "$FONT_PATH" ]; then
              FONT_PATH="/usr/share/fonts/truetype/freefont/FreeSansBold.ttf"
            fi

            # Text Transformation
            if [ "$OVERLAY_TRANSFORM" = "uppercase" ]; then
              OVERLAY_TEXT=$(echo "$OVERLAY_TEXT" | tr '[:lower:]' '[:upper:]')
            elif [ "$OVERLAY_TRANSFORM" = "lowercase" ]; then
              OVERLAY_TEXT=$(echo "$OVERLAY_TEXT" | tr '[:upper:]' '[:lower:]')
            fi

            # Calculate normalized ratios from 0.0 to 1.0
            X_RATIO=$(awk "BEGIN {printf \"%.4f\", $OVERLAY_X / 100}")
            Y_RATIO=$(awk "BEGIN {printf \"%.4f\", $OVERLAY_Y / 100}")

            # Box background parameter
            if [ "$OVERLAY_BOX" = "true" ]; then
              BOX_PARAM=":box=1:boxcolor=black@0.65:boxborderw=14"
            else
              BOX_PARAM=":box=0"
            fi

            # Escape colons, backslashes, and apostrophes for ffmpeg drawtext filter
            ESCAPED_TEXT=$(echo "$OVERLAY_TEXT" | sed "s/\\\\/\\\\\\\\/g" | sed "s/'/\\\\'/g" | sed "s/:/\\\\:/g")

            echo "Applying OBS Interactive Text Overlay:"
            echo "  Text: '$OVERLAY_TEXT'"
            echo "  Coordinates: X=${OVERLAY_X}% (${X_RATIO}), Y=${OVERLAY_Y}% (${Y_RATIO})"
            echo "  Style: Color=${OVERLAY_COLOR}, Size=${OVERLAY_SIZE}px, Box=${OVERLAY_BOX}"

            # Exact relative position mapped to video width & height
            VF_FILTER="drawtext=fontfile=${FONT_PATH}:text='${ESCAPED_TEXT}':x=(w-text_w)*${X_RATIO}:y=(h-text_h)*${Y_RATIO}:fontsize=${OVERLAY_SIZE}:fontcolor=${OVERLAY_COLOR}${BOX_PARAM}"
            
            # Stream with live OBS text overlay (2 vCPUs)
            ffmpeg -re -stream_loop -1 -i "$VIDEO_URL" \
              -vf "$VF_FILTER" \
              -r 30 \
              -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p \
              -b:v 3200k -minrate 3200k -maxrate 3200k -bufsize 6400k \
              -g 60 -keyint_min 60 -sc_threshold 0 \
              -c:a aac -b:a 128k -ar 44100 -ac 2 \
              -f flv -flvflags no_duration_filesize \
              "$RTMP_DEST"
          else
            # Stream in high-quality YouTube CBR mode (Strict 2.0s GOP, 30 fps)
            ffmpeg -re -stream_loop -1 -i "$VIDEO_URL" \
              -r 30 \
              -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p \
              -b:v 3200k -minrate 3200k -maxrate 3200k -bufsize 6400k \
              -g 60 -keyint_min 60 -sc_threshold 0 \
              -c:a aac -b:a 128k -ar 44100 -ac 2 \
              -f flv -flvflags no_duration_filesize \
              "$RTMP_DEST"
          fi

